# Render free tier (web service, Docker). Free = 750 instance-hours/month.
# Set SELF_URL to your render URL so the built-in keepalive stops it sleeping.
services:
  - type: web
    name: aurora-music-bot
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SELF_URL
        sync: false
      - key: DEFAULT_VOLUME
        value: "0.70"
      - key: MAX_QUEUE
        value: "200"
      - key: DATABASE_PATH
        value: "data/music.db"
      - key: FFMPEG_PATH
        value: "/usr/bin/ffmpeg"
